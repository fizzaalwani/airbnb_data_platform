sources:
    - name: staging
      database: AIRBNB
      schema: staging
      tables:
        - name: listings
          columns:
            - name: property_type
              data_tests:
                - accepted_values:
                    values: ['House','Apartment','Condo']
            - name: room_type
              data_tests:
                - accepted_values:
                    values: ['Entire home','Private room']
        - name: bookings
          columns:
            - name: booking_id
              data_tests:
                - not_null
            - name: booking_status
              data_tests:
                - accepted_values:
                    values: ['cancelled','confirmed']
        - name: hosts
          columns:
            - name: is_superhost
              data_tests:
                - accepted_values:
                    values: [True, False]